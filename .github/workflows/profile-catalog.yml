name: Profile catalog verification

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "schemas/**"
      - "profile_store.py"
      - "app.py"
      - "registry.py"
      - "app_backups.py"
      - "desktop-plugin/plugin.js"
      - "scripts/build-profile-catalog.py"
      - "tests/test_profile_store.py"
      - "tests/test_store_api.py"
      - ".github/workflows/profile-catalog.yml"

permissions:
  contents: read

concurrency:
  group: profile-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify generated catalog and every package
        run: uv run --no-project --with jsonschema python3 scripts/build-profile-catalog.py --check
      - name: Run catalog and public API tests
        run: uv run --no-project --with jsonschema python3 -m unittest tests.test_profile_store tests.test_store_api -v
      - name: Reject whitespace errors
        run: git diff --check
